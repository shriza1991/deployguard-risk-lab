services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:///./risklab.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY before starting}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    security_opt:
      - no-new-privileges:true
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27.3-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
