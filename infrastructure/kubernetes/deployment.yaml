apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lab-api
  namespace: deployguard-risk-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-lab-api
  template:
    metadata:
      labels:
        app: risk-lab-api
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: api
          image: ghcr.io/example/deployguard-risk-lab-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: risk-lab-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_ADMIN"]
            readOnlyRootFilesystem: true

