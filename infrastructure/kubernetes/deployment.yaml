apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lab-api
  namespace: deployguard-risk-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-lab-api
  template:
    metadata:
      labels:
        app: risk-lab-api
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: api
          image: ghcr.io/example/deployguard-risk-lab-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ENABLE_EXTENDED_DIAGNOSTICS
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7EXAMPLE_TEST_ONLY"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY_TEST_ONLY"
          envFrom:
            - configMapRef:
                name: risk-lab-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: docker-socket
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket

