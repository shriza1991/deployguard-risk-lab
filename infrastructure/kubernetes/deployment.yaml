apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lab-api
  namespace: deployguard-risk-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-lab-api
  template:
    metadata:
      labels:
        app: risk-lab-api
    spec:
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: false

      containers:
        - name: api
          image: ghcr.io/example/deployguard-risk-lab-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: risk-lab-config

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000

          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN