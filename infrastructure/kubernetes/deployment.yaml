apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lab-api
  namespace: deployguard-risk-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-lab-api
  template:
    metadata:
      labels:
        app: risk-lab-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/deployguard-risk-lab-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ENABLE_EXTENDED_DIAGNOSTICS
              value: "true"
          envFrom:
            - configMapRef:
                name: risk-lab-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 10001

