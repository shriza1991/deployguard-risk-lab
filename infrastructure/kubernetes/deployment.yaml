apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-lab-api
  namespace: deployguard-risk-lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: risk-lab-api
  template:
    metadata:
      labels:
        app: risk-lab-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/deployguard-risk-lab-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: risk-lab-config
          env:
            - name: DEBUG
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 10001

