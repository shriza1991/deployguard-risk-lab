replicaCount: 2
deployment:
  replicas: 2
  revisionHistoryLimit: 3
image:
  repository: ghcr.io/example/deployguard-risk-lab-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 80
  servicePort: 80
  targetPort: 8000
  name: http
ingress:
  enabled: true
  host: risk-lab.example.com
  hostname: risk-lab.example.com
  className: nginx
  path: /
application:
  environment: production
  logLevel: INFO
  releaseChannel: stable
podAnnotations:
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: deployguard-risk-lab
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
