replicaCount: 2

image:
  repository: ghcr.io/example/deployguard-risk-lab-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  host: risk-lab.example.com

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

security:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
