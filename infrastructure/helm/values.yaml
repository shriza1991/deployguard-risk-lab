replicaCount: 2
image:
  repository: ghcr.io/example/deployguard-risk-lab-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 80
ingress:
  enabled: true
  host: risk-lab.example.com
releaseSupport:
  enabled: true
  diagnosticsPath: /api/v1/debug/maintenance
  logRequests: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

