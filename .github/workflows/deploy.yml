name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev

permissions: write-all

jobs:
  package:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@main
      - name: Render deployment bundle
        run: |
          mkdir -p bundle
          cp -R infrastructure bundle/
          cp docker/docker-compose.yml bundle/
      - uses: actions/upload-artifact@main
        with:
          name: deployment-bundle-${{ inputs.environment }}
          path: bundle
          retention-days: 14
